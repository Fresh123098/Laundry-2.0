<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh and Clean Laundry — Management System</title>
<style>
:root{
  --blue-50:#eff6ff; --blue-100:#dbeafe; --blue-200:#bfdbfe;
  --blue-500:#0ea5e9; --blue-600:#0284c7; --blue-700:#0369a1; --blue-900:#0c4a6e;
  --green-50:#ecfdf5; --green-100:#d1fae5; --green-200:#a7f3d0;
  --green-500:#10b981; --green-600:#059669; --green-700:#047857;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
  --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155; --gray-900:#0f172a;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-500:#ef4444; --red-600:#dc2626; --red-700:#b91c1c;
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
  --purple-50:#f5f3ff; --purple-100:#ede9fe; --purple-500:#8b5cf6; --purple-600:#7c3aed;
  --sidebar:#0b2436; --sidebar-2:#123147;
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 2px 8px rgba(15,23,42,.07),0 1px 3px rgba(15,23,42,.05);
  --shadow-lg:0 12px 32px rgba(15,23,42,.14);
  --font:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-ar:'Segoe UI','Tahoma','Arial',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--gray-100);color:var(--gray-900);-webkit-font-smoothing:antialiased;font-size:14px}
html[dir="rtl"] body{font-family:var(--font-ar)}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.hidden{display:none!important}

/* ============ LOGIN ============ */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#0b2436 0%,#0c4a6e 50%,#0369a1 100%);
  position:relative;overflow:hidden;
}
.login-screen::before{
  content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,165,233,.35),transparent 65%);
  top:-200px;right:-150px;
}
.login-screen::after{
  content:'';position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.25),transparent 65%);
  bottom:-180px;left:-120px;
}
.login-card{
  position:relative;z-index:2;background:#fff;border-radius:22px;padding:40px 34px;
  width:100%;max-width:400px;box-shadow:0 30px 70px rgba(0,0,0,.35);text-align:center;
}
.login-logo{margin-bottom:18px;display:flex;justify-content:center}
.login-card h1{font-size:22px;font-weight:800;color:var(--gray-900);margin-bottom:4px;letter-spacing:-.3px}
.login-card .sub{color:var(--gray-500);font-size:13px;margin-bottom:26px;font-weight:500}
.login-card input[type="password"]{
  width:100%;padding:14px 18px;border:2px solid var(--gray-200);border-radius:12px;
  font-size:17px;text-align:center;letter-spacing:8px;outline:none;transition:.15s;margin-bottom:14px;
}
.login-card input[type="password"]:focus{border-color:var(--blue-500);box-shadow:0 0 0 4px rgba(14,165,233,.13)}
.btn-login{
  width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue-500),var(--blue-600));
  box-shadow:0 8px 20px rgba(2,132,199,.35);transition:.15s;
}
.btn-login:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.login-hint{margin-top:18px;font-size:12px;color:var(--gray-400)}
.login-hint b{color:var(--gray-600)}
.login-error{color:var(--red-600);font-size:13px;margin-bottom:10px;font-weight:600;min-height:18px}

/* ============ APP SHELL ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;flex:0 0 252px;background:var(--sidebar);color:#e2e8f0;
  display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;
  z-index:70;transition:transform .28s cubic-bezier(.4,0,.2,1);border-inline-end:1px solid rgba(255,255,255,.05);
}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-brand .txt{min-width:0}
.sidebar-brand .name{font-weight:800;font-size:14.5px;color:#fff;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-brand .sub{font-size:10px;color:#7dd3fc;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:2px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  color:#cbd5e1;font-size:14px;font-weight:600;transition:.15s;user-select:none;cursor:pointer;
}
.nav-item .ico{font-size:17px;width:20px;text-align:center;flex:0 0 auto}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;box-shadow:0 6px 16px rgba(14,165,233,.4)}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:8px}
.sidebar-foot .user{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px}
.sidebar-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green-500);box-shadow:0 0 8px var(--green-500)}
.logout-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:9px;
  background:rgba(239,68,68,.15);color:#fca5a5;font-size:12.5px;font-weight:700;transition:.15s;
}
.logout-btn:hover{background:rgba(239,68,68,.25);color:#fff}

.main{flex:1;margin-inline-start:252px;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{
  height:66px;background:#fff;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow-sm);
}
.topbar h1{font-size:18px;font-weight:800;flex:1;letter-spacing:-.3px}
.topbar .lang-btn{
  padding:7px 12px;border-radius:9px;background:var(--gray-100);color:var(--gray-700);
  font-weight:700;font-size:12.5px;transition:.15s;border:1px solid var(--gray-200);
}
.topbar .lang-btn:hover{background:var(--gray-200)}
.hamburger{display:none;font-size:22px;color:var(--gray-700);padding:6px;border-radius:8px}
.hamburger:hover{background:var(--gray-100)}
.content{padding:22px;flex:1;max-width:1500px;width:100%;margin:0 auto}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;
  transition:.15s;white-space:nowrap;line-height:1;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;box-shadow:0 4px 12px rgba(2,132,199,.28)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-green{background:linear-gradient(135deg,var(--green-500),var(--green-600));color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn-green:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}
.btn-ghost:hover{background:var(--gray-200)}
.btn-danger{background:var(--red-100);color:var(--red-700)}
.btn-danger:hover{background:#fecaca}
.btn-amber{background:var(--amber-100);color:var(--amber-700)}
.btn-amber:hover{background:#fde68a}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn-icon{
  width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;
  font-size:14px;background:var(--gray-100);color:var(--gray-600);transition:.15s;border:1px solid transparent;
}
.btn-icon:hover{background:var(--gray-200)}
.btn-icon.wa{background:var(--green-100);color:var(--green-700)}
.btn-icon.wa:hover{background:#a7f3d0}
.btn-icon.danger{background:var(--red-100);color:var(--red-700)}
.btn-icon.danger:hover{background:#fecaca}
.btn-icon.print{background:var(--blue-100);color:var(--blue-700)}
.btn-icon.print:hover{background:var(--blue-200)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* ============ CARDS ============ */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;border:1px solid rgba(15,23,42,.04)}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;
}
.card-head h2{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card-head h2 .ico{font-size:16px}
.card-body{padding:20px}

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{
  background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;border-inline-start:4px solid var(--blue-500);
  border-top:1px solid rgba(15,23,42,.04);border-inline-end:1px solid rgba(15,23,42,.04);border-bottom:1px solid rgba(15,23,42,.04);
}
.stat.blue{border-inline-start-color:var(--blue-500)}
.stat.green{border-inline-start-color:var(--green-500)}
.stat.amber{border-inline-start-color:var(--amber-500)}
.stat.purple{border-inline-start-color:var(--purple-500)}
.stat.red{border-inline-start-color:var(--red-500)}
.stat-ico{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:22px;background:var(--blue-50);flex:0 0 auto;
}
.stat.green .stat-ico{background:var(--green-50)}
.stat.amber .stat-ico{background:var(--amber-50)}
.stat.purple .stat-ico{background:var(--purple-50)}
.stat.red .stat-ico{background:var(--red-50)}
.stat-lbl{font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.3px;word-break:break-word}
.stat-sub{font-size:11.5px;color:var(--gray-400);margin-top:2px;font-weight:500}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:start;padding:11px 16px;background:var(--gray-50);color:var(--gray-500);
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
  border-bottom:1px solid var(--gray-200);white-space:nowrap;
}
td{padding:11px 16px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
tbody tr:hover{background:var(--gray-50)}
tbody tr:last-child td{border-bottom:none}
.empty{text-align:center;padding:44px 20px;color:var(--gray-400);font-size:14px}
.empty .big{font-size:38px;display:block;margin-bottom:8px;opacity:.6}

/* ============ BADGES ============ */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.badge.paid{background:var(--green-100);color:var(--green-700)}
.badge.partial{background:var(--amber-100);color:var(--amber-700)}
.badge.unpaid{background:var(--red-100);color:var(--red-700)}
.badge.monthly{background:var(--purple-100);color:var(--purple-600)}
.badge.own{background:var(--blue-100);color:var(--blue-700)}

.status-select{
  padding:6px 10px;border-radius:8px;border:1.5px solid var(--gray-200);font-size:12px;
  font-weight:700;background:#fff;outline:none;cursor:pointer;
}
.status-select:focus{border-color:var(--blue-500)}
.st-received{color:var(--blue-700);border-color:var(--blue-200);background:var(--blue-50)}
.st-washing{color:var(--purple-600);border-color:var(--purple-100);background:var(--purple-50)}
.st-ironing{color:var(--amber-700);border-color:var(--amber-100);background:var(--amber-50)}
.st-ready{color:var(--green-700);border-color:var(--green-200);background:var(--green-50)}
.st-delivered{color:var(--gray-500);border-color:var(--gray-200);background:var(--gray-50)}
.st-cancelled{color:var(--red-700);border-color:var(--red-100);background:var(--red-50)}

/* ============ FORMS ============ */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--gray-600)}
.field input,.field select,.field textarea{
  padding:10px 13px;border:1.5px solid var(--gray-200);border-radius:10px;
  background:#fff;outline:none;transition:.15s;width:100%;font-size:14px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(14,165,233,.13)}
.field textarea{resize:vertical;min-height:70px;font-family:inherit;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--gray-400);margin-top:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{
  padding:9px 13px;border:1.5px solid var(--gray-200);border-radius:10px;
  outline:none;background:#fff;font-size:13.5px;
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.toolbar .spacer{flex:1}

/* ============ VIEWS ============ */
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============ POS ============ */
.pos-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.pos-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(15,23,42,.04)}
.pos-panel-head{padding:14px 18px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pos-panel-head h3{font-size:14px;font-weight:800;flex:1}
.pos-panel-body{padding:16px}

.search-box{position:relative;flex:1;min-width:180px}
.search-box input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--gray-200);border-radius:10px;outline:none;font-size:14px;transition:.15s}
.search-box input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.search-box .ico{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:15px}
html[dir="rtl"] .search-box input{padding:11px 40px 11px 14px}

.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-chip{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--gray-100);color:var(--gray-600);border:1.5px solid transparent;transition:.15s;
}
.cat-chip:hover{background:var(--gray-200)}
.cat-chip.active{background:var(--blue-500);color:#fff;border-color:var(--blue-500)}

.item-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;
  max-height:420px;overflow-y:auto;padding:2px;
}
.item-card{
  padding:11px 12px;border-radius:11px;background:var(--gray-50);border:1.5px solid var(--gray-200);
  text-align:start;transition:.13s;cursor:pointer;display:flex;flex-direction:column;gap:4px;
}
.item-card:hover{border-color:var(--blue-500);background:var(--blue-50);transform:translateY(-1px)}
.item-card:active{transform:translateY(0)}
.item-card .ic-name{font-weight:800;font-size:13px;line-height:1.25;color:var(--gray-900)}
.item-card .ic-cat{font-size:10px;color:var(--gray-500);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.item-card .ic-price{font-size:12px;color:var(--blue-700);font-weight:800;margin-top:2px}

.cart-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;margin-bottom:12px;padding:2px}
.cart-empty{text-align:center;padding:30px 16px;color:var(--gray-400);font-size:13px}
.cart-empty .big{font-size:32px;display:block;margin-bottom:6px;opacity:.6}
.cart-item{
  background:var(--gray-50);border:1px solid var(--gray-200);border-radius:11px;padding:10px 11px;
  display:flex;flex-direction:column;gap:8px;
}
.cart-item-top{display:flex;align-items:center;gap:8px}
.cart-item-top .ci-name{font-weight:800;font-size:13.5px;flex:1;line-height:1.25}
.cart-item-top .ci-del{
  width:26px;height:26px;border-radius:7px;background:var(--red-100);color:var(--red-700);
  display:grid;place-items:center;font-size:12px;font-weight:800;
}
.cart-item-top .ci-del:hover{background:#fecaca}
.cart-item-controls{display:grid;grid-template-columns:1.2fr .7fr .9fr auto;gap:7px;align-items:center}
.cart-item-controls select,.cart-item-controls input{
  padding:7px 9px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:12.5px;
  outline:none;background:#fff;width:100%;transition:.15s;
}
.cart-item-controls select:focus,.cart-item-controls input:focus{border-color:var(--blue-500)}
.ci-line-total{font-weight:800;font-size:13px;color:var(--gray-900);text-align:end;white-space:nowrap}
.ci-special{grid-column:1/-1;display:flex;gap:7px;align-items:center}
.ci-special label{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--gray-500);letter-spacing:.3px;white-space:nowrap}
.ci-special input{flex:1;padding:6px 9px;border:1.5px solid var(--gray-200);border-radius:7px;font-size:12px;outline:none}
.ci-special input:focus{border-color:var(--blue-500)}

.customer-box{background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:11px;padding:12px;margin-bottom:14px}
.customer-box .cb-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.customer-box .cb-head strong{font-size:12.5px;color:var(--blue-900);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.customer-box select,.customer-box input{width:100%;padding:9px 11px;border:1.5px solid var(--blue-200);border-radius:9px;background:#fff;outline:none;font-size:13.5px;margin-bottom:8px}
.customer-box select:focus,.customer-box input:focus{border-color:var(--blue-500)}
.customer-box .cb-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.totals-box{background:var(--gray-50);border-radius:12px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--gray-200)}
.totals-box .t-line{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:8px;color:var(--gray-600)}
.totals-box .t-line:last-child{margin-bottom:0}
.totals-box .t-line .val{font-weight:700;color:var(--gray-900)}
.totals-box .t-line.grand{
  border-top:2px dashed var(--gray-300);padding-top:10px;margin-top:10px;
  font-size:16px;font-weight:800;color:var(--gray-900);
}
.totals-box .t-line.grand .val{font-size:19px;color:var(--blue-700)}
.totals-box .t-input{
  width:90px;padding:5px 9px;border:1.5px solid var(--gray-200);border-radius:7px;text-align:end;
  font-size:13px;font-weight:700;outline:none;background:#fff;
}
.totals-box .t-input:focus{border-color:var(--blue-500)}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pay-grid .field{margin-bottom:0}
.pay-grid .field label{font-size:11px}
.pay-grid .field input,.pay-grid .field select{padding:8px 10px;font-size:13px}

.pos-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-actions .btn{width:100%}

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(11,36,54,.6);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:200;overflow-y:auto;
}
.modal-backdrop.show{display:flex}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:520px;margin:auto;
  box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.34,1.56,.64,1);overflow:hidden;
}
.modal.wide{max-width:820px}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:12px}
.modal-head h3{font-size:16px;font-weight:800;flex:1}
.modal-close{width:32px;height:32px;border-radius:9px;background:var(--gray-100);color:var(--gray-600);display:grid;place-items:center;font-size:14px}
.modal-close:hover{background:var(--gray-200)}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--gray-100);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--gray-50)}

/* ============ INVOICE ============ */
.invoice{
  background:#fff;padding:34px 38px;font-size:13px;color:var(--gray-900);max-width:800px;margin:0 auto;
  font-family:var(--font);
}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;padding-bottom:22px;border-bottom:2px solid var(--gray-200)}
.inv-shop{display:flex;gap:14px;align-items:flex-start}
.inv-shop-txt h1{font-size:20px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px;line-height:1.15}
.inv-shop-txt p{font-size:11.5px;color:var(--gray-500);line-height:1.55;margin:0}
.inv-title{text-align:end;flex:0 0 auto}
.inv-title h2{font-size:26px;font-weight:900;color:var(--blue-600);letter-spacing:2px;line-height:1;margin-bottom:8px}
.inv-title .no{font-size:14px;font-weight:800;color:var(--gray-900);margin-bottom:6px}
.inv-title .dt{font-size:11.5px;color:var(--gray-500);line-height:1.6}

.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.inv-block h4{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-400);font-weight:800;margin-bottom:6px}
.inv-block p{font-size:13px;line-height:1.6;margin:0;color:var(--gray-900)}
.inv-block p.muted{color:var(--gray-500);font-size:12px}

.inv-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12.5px}
.inv-table th{
  background:var(--blue-50);color:var(--blue-900);padding:9px 11px;text-align:start;
  font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;border-bottom:2px solid var(--blue-200);
}
.inv-table td{padding:9px 11px;border-bottom:1px solid var(--gray-100)}
.inv-table td.num,.inv-table th.num{text-align:end}
.inv-table tbody tr:last-child td{border-bottom:1px solid var(--gray-200)}

.inv-summary{display:flex;justify-content:flex-end;margin-bottom:22px}
.inv-summary-box{width:100%;max-width:320px}
.inv-summary-box .s-line{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;color:var(--gray-600)}
.inv-summary-box .s-line .v{font-weight:700;color:var(--gray-900)}
.inv-summary-box .s-line.total{
  border-top:2px solid var(--gray-300);margin-top:6px;padding-top:10px;font-size:15px;font-weight:800;color:var(--gray-900);
}
.inv-summary-box .s-line.total .v{font-size:17px;color:var(--blue-700)}
.inv-summary-box .s-line.balance{background:var(--amber-50);padding:8px 10px;border-radius:8px;margin-top:8px;font-weight:800}
.inv-summary-box .s-line.balance .v{color:var(--amber-700);font-size:15px}
.inv-summary-box .s-line.balance.paid{background:var(--green-50)}
.inv-summary-box .s-line.balance.paid .v{color:var(--green-700)}

.inv-foot{border-top:1px solid var(--gray-200);padding-top:16px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--gray-500);flex-wrap:wrap}
.inv-foot .thanks{font-weight:700;color:var(--blue-700);font-size:12px;margin-bottom:4px}
.inv-status-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.4px}

/* ============ REPORTS ============ */
.range-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.range-bar .btn.active{background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;border-color:transparent}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:10px 4px;border-bottom:1.5px solid var(--gray-200);overflow-x:auto}
.chart-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
.chart-col .bar{
  width:100%;max-width:36px;background:linear-gradient(180deg,var(--blue-400,#38bdf8),var(--blue-600));
  border-radius:5px 5px 0 0;min-height:3px;transition:.2s;position:relative;
}
.chart-col .bar:hover{filter:brightness(1.1)}
.chart-col .lbl{font-size:9.5px;color:var(--gray-500);font-weight:700;white-space:nowrap}
.chart-col .amt{font-size:9.5px;color:var(--gray-700);font-weight:800;white-space:nowrap}

.pop-list{display:flex;flex-direction:column;gap:9px}
.pop-row{display:flex;align-items:center;gap:10px}
.pop-rank{width:22px;height:22px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto}
.pop-name{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-bar-wrap{flex:0 0 90px;height:7px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.pop-bar{height:100%;background:linear-gradient(90deg,var(--blue-500),var(--green-500));border-radius:4px}
.pop-val{font-size:12px;font-weight:800;color:var(--gray-700);flex:0 0 auto;min-width:70px;text-align:end}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--gray-900);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;
  font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(16px);
  transition:.3s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:linear-gradient(135deg,var(--green-600),var(--green-700))}
.toast.error{background:linear-gradient(135deg,var(--red-600),var(--red-700))}
.toast.info{background:linear-gradient(135deg,var(--blue-600),var(--blue-700))}

/* ============ PRINT ============ */
#printArea{display:none}
@media print{
  @page{margin:12mm;size:A4}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;inset-inline-start:0;top:0;width:100%;background:#fff}
  #printArea .invoice{padding:0;max-width:none;box-shadow:none}
  .no-print{display:none!important}
}

/* ============ OVERLAY ============ */
.overlay{display:none;position:fixed;inset:0;background:rgba(11,36,54,.55);z-index:65}
.overlay.show{display:block}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){
  .pos-grid{grid-template-columns:1fr}
  .item-grid{max-height:280px}
  .cart-list{max-height:none}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  html[dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)!important}
  .main{margin-inline-start:0}
  .hamburger{display:block}
  .content{padding:16px}
  .topbar{padding:0 16px;height:60px}
  .topbar h1{font-size:16px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .inv-meta{grid-template-columns:1fr}
  .invoice{padding:20px 18px}
  .inv-top{flex-direction:column;gap:14px}
  .inv-title{text-align:start}
  .inv-title h2{font-size:22px}
  .stat-val{font-size:17px}
  .card-head{padding:14px 16px}
  .card-body{padding:16px}
}
@media(max-width:560px){
  .cart-item-controls{grid-template-columns:1fr 1fr}
  .ci-line-total{grid-column:1/-1;text-align:start}
  .pos-actions{grid-template-columns:1fr}
  .modal-body{padding:16px}
  .modal-head{padding:14px 16px}
  .modal-foot{padding:12px 16px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:12px 14px;gap:10px}
  .stat-ico{width:38px;height:38px;font-size:18px;border-radius:10px}
  .stat-lbl{font-size:10px}
  .stat-val{font-size:15px}
  .login-card{padding:30px 24px}
  .item-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .topbar .lang-btn{padding:6px 10px;font-size:11.5px}
}
</style>
</head>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo" id="loginLogo"></div>
    <h1 id="loginShopName">Fresh and Clean Laundry</h1>
    <p class="sub" id="loginSub">Admin Access</p>
    <div class="login-error" id="loginError"></div>
    <input type="password" id="pinInput" placeholder="Enter PIN" inputmode="numeric" autocomplete="off">
    <button class="btn-login" id="loginBtn">Login</button>
    <p class="login-hint" id="loginHint">Default PIN: <b>1234</b></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appShell" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div id="sideLogo"></div>
      <div class="txt">
        <div class="name" id="sideShopName">Fresh &amp; Clean</div>
        <div class="sub">Laundry • Bahrain</div>
      </div>
    </div>
    <nav class="nav" id="navMenu"></nav>
    <div class="sidebar-foot">
      <div class="user"><span class="dot"></span> <span id="sideUser">Admin session</span></div>
      <button class="logout-btn" id="logoutBtn">⎋ <span data-i18n="logout">Logout</span></button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <button class="lang-btn" id="langBtn">🌐 العربية</button>
      <button class="btn btn-primary btn-sm" id="quickNewBill">＋ <span data-i18n="newBill">New Bill</span></button>
    </header>
    <div class="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-pos" class="view"></section>
      <section id="view-orders" class="view"></section>
      <section id="view-items" class="view"></section>
      <section id="view-customers" class="view"></section>
      <section id="view-reports" class="view"></section>
      <section id="view-settings" class="view"></section>
    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<!-- ================= TOASTS ================= -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ================= PRINT AREA ================= -->
<div id="printArea"></div>

      if (d && d.settings && Array.isArray(d.items)) {
        d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings);
        if (!Array.isArray(d.customers)) d.customers = [];
        if (!Array.isArray(d.orders)) d.orders = [];
        return d;
      }
    }
  } catch(e){ console.warn('load failed', e); }
  const s = defaultState();
  seedSampleData(s);
  return s;
}

function seedSampleData(s){
  const c1 = { id: uid(), name: 'Ahmed Al Khalifa', phone: '+973 3300 1111', address: 'Riffa, Bahrain', notes: '', type:'own' };
  const c2 = { id: uid(), name: 'Fatima Al Sayed', phone: '+973 3300 2222', address: 'Manama, Bahrain', notes: '', type:'monthly' };
  const c3 = { id: uid(), name: 'Mohammed Ali', phone: '+973 3300 3333', address: 'Muharraq, Bahrain', notes: '', type:'own' };
  s.customers = [c1, c2, c3];

  const shirt = s.items.find(i => i.name === 'Shirt');
  const trouser = s.items.find(i => i.name === 'Trousers');
  const abaya = s.items.find(i => i.name === 'Abaya');
  const thobe = s.items.find(i => i.name === 'Dishdasha / Thobe');

  const today = new Date();
  const d1 = new Date(today); d1.setDate(d1.getDate() - 1);
  const d2 = new Date(today); d2.setDate(d2.getDate() - 3);
  const d3 = new Date(today);

  function mkOrder(cust, dateObj, items, paid, method, status){
    const iso = dateObj.toISOString().slice(0,10);
    const del = new Date(dateObj); del.setDate(del.getDate() + 2);
    const itemsOut = items.map(x => ({
      uid: uid(),
      itemId: x.item.id,
      name: x.item.name,
      service: x.service,
      qty: x.qty,
      basePrice: x.service === 'Wash' ? x.item.washPrice
              : x.service === 'Iron' ? x.item.ironPrice
              : x.service === 'Dry Clean' ? x.item.dryPrice
              : (x.item.washPrice + x.item.ironPrice),
      specialCharge: 0
    }));
    const subtotal = itemsOut.reduce((a,b) => a + b.qty * (b.basePrice + b.specialCharge), 0);
    const total = subtotal;
    const paidAmt = paid ? total : Math.round(total * 0.4 * 1000) / 1000;
    return {
      id: uid(), invoiceNo: s.settings.invoicePrefix + String(s.settings.nextInvoiceNo++).padStart(4,'0'),
      customerId: cust.id, customerName: cust.name, customerPhone: cust.phone,
      items: itemsOut, discount: 0, extraCharges: 0,
      subtotal, vatAmount: 0, total, paid: paidAmt, balance: Math.max(0, total - paidAmt),
      paymentMethod: method, status, date: iso, deliveryDate: del.toISOString().slice(0,10),
      note: '', createdAt: dateObj.getTime()
    };
  }

  s.orders = [
    mkOrder(c1, d1, [{ item: shirt, service:'Wash', qty:3 }, { item: trouser, service:'Iron', qty:2 }], true, 'Cash', 'Delivered'),
    mkOrder(c2, d2, [{ item: abaya, service:'Dry Clean', qty:2 }, { item: thobe, service:'Wash', qty:3 }], false, 'BenefitPay', 'Ready for Pickup'),
    mkOrder(c3, d3, [{ item: shirt, service:'Wash & Iron', qty:5 }], false, 'Cash', 'Washing')
  ];
  s.settings.nextInvoiceNo = 4;
}

/* -------------------- UTILITIES -------------------- */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoPlusDays(iso, days){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  if (!d) return iso;
  const months = uiLang === 'ar'
    ? ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[+m-1]} ${y}`;
}
function fmtBHD(n){
  const v = Number(n) || 0;
  const cur = state.settings.currency || 'BHD';
  const abs = Math.abs(v);
  return (v < 0 ? '-' : '') + cur + ' ' + abs.toFixed(3);
}
function round3(n){ return Math.round((Number(n) || 0) * 1000) / 1000; }

function priceForService(item, service){
  if (!item) return 0;
  switch (service){
    case 'Wash': return Number(item.washPrice) || 0;
    case 'Iron': return Number(item.ironPrice) || 0;
    case 'Dry Clean': return Number(item.dryPrice) || 0;
    case 'Wash & Iron': return (Number(item.washPrice) || 0) + (Number(item.ironPrice) || 0);
    default: return 0;
  }
}
function defaultServiceFor(item){
  if ((Number(item.washPrice) || 0) > 0) return 'Wash';
  if ((Number(item.dryPrice) || 0) > 0) return 'Dry Clean';
  if ((Number(item.ironPrice) || 0) > 0) return 'Iron';
  return 'Wash';
}

function orderSubtotal(o){ return round3((o.items || []).reduce((a,b) => a + (Number(b.qty)||0) * ((Number(b.basePrice)||0) + (Number(b.specialCharge)||0)), 0)); }
function orderTotal(o){ return round3(Math.max(0, orderSubtotal(o) - (Number(o.discount)||0) + (Number(o.extraCharges)||0) + (Number(o.vatAmount)||0))); }
function orderPaid(o){ return Number(o.paid) || 0; }
function orderBalance(o){ return round3(Math.max(0, orderTotal(o) - orderPaid(o))); }
function orderPaymentStatus(o){
  if (o.status === 'Cancelled') return 'cancelled';
  const bal = orderBalance(o);
  const paid = orderPaid(o);
  if (bal <= 0.0005) return 'paid';
  if (paid > 0.0005) return 'partial';
  return 'unpaid';
}
function paymentStatusLabel(o){
  const s = orderPaymentStatus(o);
  return s === 'paid' ? t('paidStatus') : s === 'partial' ? t('partialStatus') : s === 'cancelled' ? t('cancelled') : t('unpaidStatus');
}
function paymentBadge(o){
  const s = orderPaymentStatus(o);
  const cls = s === 'paid' ? 'paid' : s === 'partial' ? 'partial' : s === 'cancelled' ? 'unpaid' : 'unpaid';
  return `<span class="badge ${cls}">${esc(paymentStatusLabel(o))}</span>`;
}

function nextInvoiceNoStr(){
  const p = state.settings.invoicePrefix || 'FCL-';
  return p + String(state.settings.nextInvoiceNo || 1).padStart(4,'0');
}

function customerById(id){ return state.customers.find(c => c.id === id); }
function itemById(id){ return state.items.find(i => i.id === id); }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 320); }, 2600);
}

  el.innerHTML = `
    <div class="pos-grid">

      <div class="pos-panel">

          <h3>${t('items')}</h3>
          <div class="search-box">

          <button class="btn btn-ghost btn-sm" id="posClearBtn">${t('clear')}</button>
        </div>
        <div class="pos-panel-body">

      document.getElementById('posCustomerPhone').value = c.phone || '';

  document.getElementById('posAddCustomerBtn').addEventListener('click', () => {

    const phone = document.getElementById('posCustomerPhone').value.trim();
    if (!name) { toast(t('name') + '?', 'error'); return; }
    const c = { id: uid(), name, phone, address:'', notes:'', type:'own' };

    save();
    currentCustomerId = c.id;
    sel.innerHTML = '<option value="">' + t('selectCustomer') + '</option>' +

      ).join('');

function filterPosItems(){
  const q = (document.getElementById('posItemSearch').value || '').toLowerCase().trim();
  const activeCat = document.querySelector('#posCatChips .cat-chip.active');
  const cat = activeCat ? activeCat.dataset.cat : '';
  document.querySelectorAll('#posItemGrid .item-card').forEach(card => {
    const name = (card.dataset.name || '').toLowerCase();
    const c = card.dataset.cat || '';
    const okQ = !q || name.includes(q);
    const okC = !cat || c === cat;
    card.style.display = (okQ && okC) ? '' : 'none';
  });
}

function renderPosItemGrid(){
  const grid = document.getElementById('posItemGrid');
  if (!grid) return;
  if (!state.items.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><span class="big">👕</span>${t('noItems')}</div>`;
    return;
  }
  grid.innerHTML = state.items.map(it => {
    const prices = [];
    if (it.washPrice > 0) prices.push('W ' + fmtBHD(it.washPrice).replace('BHD ',''));
    if (it.ironPrice > 0) prices.push('I ' + fmtBHD(it.ironPrice).replace('BHD ',''));
    if (it.dryPrice > 0) prices.push('D ' + fmtBHD(it.dryPrice).replace('BHD ',''));
    return `<button class="item-card" data-name="${esc(it.name)}" data-cat="${esc(it.category)}" data-id="${it.id}">
      <div class="ic-name">${esc(it.name)}</div>
      <div class="ic-cat">${esc(it.category)}</div>
      <div class="ic-price">${prices.join(' • ') || fmtBHD(0)}</div>
    </button>`;
  }).join('');

  grid.querySelectorAll('.item-card').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
}

function addToCart(itemId){
  const item = itemById(itemId);
  if (!item) return;
  const svc = defaultServiceFor(item);
  const price = priceForService(item, svc);
  cart.push({
    uid: uid(),
    itemId: item.id,
    name: item.name,
    service: svc,
    qty: 1,
    basePrice: price,
    specialCharge: Number(item.specialCharge) || 0
  });
  renderCart();
  toast(item.name + ' +', 'success');
}

function renderCart(){
  const list = document.getElementById('posCartList');
  const totals = document.getElementById('posTotals');
  if (!list) return;

  if (!cart.length) {
    list.innerHTML = `<div class="cart-empty"><span class="big">🛒</span>${t('emptyCart')}</div>`;
    renderTotals();
    return;
  }

  list.innerHTML = cart.map((line, idx) => {
    const lineTotal = round3(line.qty * (line.basePrice + line.specialCharge));
    return `<div class="cart-item" data-uid="${line.uid}">
      <div class="cart-item-top">
        <div class="ci-name">${esc(line.name)}</div>
        <button class="ci-del" data-uid="${line.uid}">✕</button>
      </div>
      <div class="cart-item-controls">
        <select class="ci-service" data-uid="${line.uid}">
          ${['Wash','Iron','Dry Clean','Wash & Iron'].map(s =>
            `<option value="${s}" ${line.service === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <input class="ci-qty" type="number" min="0.01" step="0.01" value="${line.qty}" data-uid="${line.uid}">
        <input class="ci-price" type="number" min="0" step="0.001" value="${line.basePrice}" data-uid="${line.uid}" title="${t('unitPrice')}">
        <div class="ci-line-total">${fmtBHD(lineTotal)}</div>
      </div>
      <div class="ci-special">
        <label>${t('specialCharge')}</label>
        <input class="ci-special-input" type="number" min="0" step="0.001" value="${line.specialCharge}" data-uid="${line.uid}">
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.ci-del').forEach(b => b.addEventListener('click', () => {
    cart = cart.filter(l => l.uid !== b.dataset.uid);
    renderCart();
  }));
  list.querySelectorAll('.ci-service').forEach(s => s.addEventListener('change', () => {
    const line = cart.find(l => l.uid === s.dataset.uid);
    if (!line) return;
    const item = itemById(line.itemId);
    line.service = s.value;
    line.basePrice = priceForService(item, s.value);
    renderCart();
  }));
  list.querySelectorAll('.ci-qty').forEach(inp => inp.addEventListener('input', () => {
    const line = cart.find(l => l.uid === inp.dataset.uid);
    if (!line) return;
    line.qty = Math.max(0.01, parseFloat(inp.value) || 0);
    renderTotals();
    const lt = inp.closest('.cart-item').querySelector('.ci-line-total');
    lt.textContent = fmtBHD(round3(line.qty * (line.basePrice + line.specialCharge)));
  }));
  list.querySelectorAll('.ci-price').forEach(inp => inp.addEventListener('input', () => {
    const line = cart.find(l => l.uid === inp.dataset.uid);
    if (!line) return;
    line.basePrice = Math.max(0, parseFloat(inp.value) || 0);
    renderTotals();
    const lt = inp.closest('.cart-item').querySelector('.ci-line-total');
    lt.textContent = fmtBHD(round3(line.qty * (line.basePrice + line.specialCharge)));
  }));
  list.querySelectorAll('.ci-special-input').forEach(inp => inp.addEventListener('input', () => {
    const line = cart.find(l => l.uid === inp.dataset.uid);
    if (!line) return;
    line.specialCharge = Math.max(0, parseFloat(inp.value) || 0);
    renderTotals();
    const lt = inp.closest('.cart-item').querySelector('.ci-line-total');
    lt.textContent = fmtBHD(round3(line.qty * (line.basePrice + line.specialCharge)));
  }));

  renderTotals();
}

function renderTotals(){
  const box = document.getElementById('posTotals');
  if (!box) return;

  const editing = editingOrderId ? state.orders.find(o => o.id === editingOrderId) : null;
  const sub = round3(cart.reduce((a,b) => a + b.qty * (b.basePrice + b.specialCharge), 0));
  const disc = parseFloat(document.getElementById('posDiscount')?.value || (editing?.discount || 0)) || 0;
  const extra = parseFloat(document.getElementById('posExtra')?.value || (editing?.extraCharges || 0)) || 0;
  const vatEnabled = !!state.settings.vatEnabled;
  const vatRate = Number(state.settings.vatRate) || 0;
  const taxable = Math.max(0, sub - disc + extra);
  const vat = vatEnabled ? round3(taxable * vatRate / 100) : 0;
  const total = round3(Math.max(0, taxable + vat));
  const paidInput = document.getElementById('posPaid')?.value;
  const paid = paidInput !== undefined && paidInput !== '' ? Math.max(0, parseFloat(paidInput) || 0) : (editing ? orderPaid(editing) : 0);
  const balance = round3(Math.max(0, total - paid));
  const method = document.getElementById('posMethod')?.value || (editing?.paymentMethod || 'Cash');

  box.innerHTML = `
    <div class="t-line"><span>${t('subtotal')}</span><span class="val">${fmtBHD(sub)}</span></div>
    <div class="t-line"><span>${t('discount')}</span>
      <input class="t-input" id="posDiscount" type="number" min="0" step="0.001" value="${disc}">
    </div>
    <div class="t-line"><span>${t('extraCharges')}</span>
      <input class="t-input" id="posExtra" type="number" min="0" step="0.001" value="${extra}">
    </div>
    ${vatEnabled ? `<div class="t-line"><span>${t('vat')} (${vatRate}%)</span><span class="val">${fmtBHD(vat)}</span></div>` : ''}
    <div class="t-line grand"><span>${t('total')}</span><span class="val">${fmtBHD(total)}</span></div>
    <div class="pay-grid">
      <div class="field"><label>${t('paid')}</label>
        <input id="posPaid" type="number" min="0" step="0.001" value="${paid}">
      </div>
      <div class="field"><label>${t('paymentMethod')}</label>
        <select id="posMethod">
          ${PAYMENT_METHODS.map(m => `<option value="${m}" ${method === m ? 'selected' : ''}>${methodLabel(m)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="t-line" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--gray-300)">
      <span><strong>${t('balance')}</strong></span>
      <span class="val" style="color:${balance > 0 ? 'var(--red-600)' : 'var(--green-600)'};font-size:16px">${fmtBHD(balance)}</span>
    </div>
  `;

  ['posDiscount','posExtra','posPaid','posMethod'].forEach(id => {
    const e = document.getElementById(id);
    if (e) e.addEventListener('input', renderTotals);
    if (e) e.addEventListener('change', renderTotals);
  });
}

function saveOrder(doPrint, doPreview, doWA){
  if (!cart.length) { toast(t('addItemFirst'), 'error'); return; }
  if (!currentCustomerId) { toast(t('selectCustomerFirst'), 'error'); return; }
  const cust = customerById(currentCustomerId);
  if (!cust) { toast(t('selectCustomerFirst'), 'error'); return; }

  // sync name/phone from the POS fields if edited
  const nameInput = document.getElementById('posCustomerName');
  const phoneInput = document.getElementById('posCustomerPhone');
  if (nameInput && nameInput.value.trim()) cust.name = nameInput.value.trim();
  if (phoneInput) cust.phone = phoneInput.value.trim();

  const discount = parseFloat(document.getElementById('posDiscount')?.value) || 0;
  const extra = parseFloat(document.getElementById('posExtra')?.value) || 0;
  const paidInput = document.getElementById('posPaid')?.value;
  const paid = paidInput !== undefined && paidInput !== '' ? Math.max(0, parseFloat(paidInput) || 0) : 0;
  const method = document.getElementById('posMethod')?.value || 'Cash';

  const sub = round3(cart.reduce((a,b) => a + b.qty * (b.basePrice + b.specialCharge), 0));
  const taxable = Math.max(0, sub - discount + extra);
  const vat = state.settings.vatEnabled ? round3(taxable * (Number(state.settings.vatRate) || 0) / 100) : 0;
  const total = round3(taxable + vat);
  const balance = round3(Math.max(0, total - paid));

  const itemsOut = cart.map(l => ({
    uid: l.uid || uid(),
    itemId: l.itemId,
    name: l.name,
    service: l.service,
    qty: l.qty,
    basePrice: l.basePrice,
    specialCharge: l.specialCharge
  }));

  let order;
  if (editingOrderId) {
    order = state.orders.find(o => o.id === editingOrderId);
    Object.assign(order, {
      customerId: cust.id, customerName: cust.name, customerPhone: cust.phone || '',
      items: itemsOut, discount, extraCharges: extra,
      subtotal: sub, vatAmount: vat, total, paid, balance,
      paymentMethod: method
    });
    toast(t('orderUpdated'), 'success');
  } else {
    order = {
      id: uid(),
      invoiceNo: nextInvoiceNoStr(),
      customerId: cust.id, customerName: cust.name, customerPhone: cust.phone || '',
      items: itemsOut, discount, extraCharges: extra,
      subtotal: sub, vatAmount: vat, total, paid, balance,
      paymentMethod: method,
      status: 'Received',
      date: todayISO(),
      deliveryDate: isoPlusDays(todayISO(), 2),
      note: '',
      createdAt: Date.now()
    };
    state.orders.push(order);
    state.settings.nextInvoiceNo = (Number(state.settings.nextInvoiceNo) || 1) + 1;
    toast(t('orderSaved') + ' — ' + order.invoiceNo, 'success');
  }

  save();

  const orderId = order.id;
  editingOrderId = null;
  cart = [];
  currentCustomerId = '';

  if (doPrint) {
    showInvoice(orderId, true);
  } else if (doWA) {
    sendWhatsApp(orderId);
    showView('orders');
  } else {
    showView('orders');
  }
}

/* =====================================================================
   ORDERS
   ===================================================================== */
let orderFilterStatus = 'all';
let orderFilterPayment = 'all';
let orderSearchQ = '';

function renderOrders(){
  const el = document.getElementById('view-orders');
  const list = [...state.orders].sort((a,b) =>
    (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt
  );

  const filtered = list.filter(o => {
    if (orderFilterStatus !== 'all' && o.status !== orderFilterStatus) return false;
    const ps = orderPaymentStatus(o);
    if (orderFilterPayment === 'paid' && ps !== 'paid') return false;
    if (orderFilterPayment === 'unpaid' && ps !== 'unpaid') return false;
    if (orderFilterPayment === 'partial' && ps !== 'partial') return false;
    if (orderSearchQ) {
      const q = orderSearchQ.toLowerCase();
      if (!o.invoiceNo.toLowerCase().includes(q) &&
          !(o.customerName || '').toLowerCase().includes(q) &&
          !(o.customerPhone || '').includes(q)) return false;
    }
    return true;
  });

  el.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2><span class="ico">📋</span> ${t('orders')} <span style="color:var(--gray-400);font-weight:600;font-size:12px">(${filtered.length})</span></h2>
        <div class="toolbar">
          <input type="search" id="ordSearch" placeholder="${t('searchOrders')}" value="${esc(orderSearchQ)}" style="min-width:200px">
          <select id="ordStatus">
            <option value="all">${t('filterStatus')}</option>
            ${STATUSES.map(s => `<option value="${s}" ${orderFilterStatus === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}
          </select>
          <select id="ordPay">
            <option value="all">${t('filterPay')}</option>
            <option value="paid" ${orderFilterPayment === 'paid' ? 'selected' : ''}>${t('paidFilter')}</option>
            <option value="unpaid" ${orderFilterPayment === 'unpaid' ? 'selected' : ''}>${t('unpaidFilter')}</option>
            <option value="partial" ${orderFilterPayment === 'partial' ? 'selected' : ''}>${t('partialFilter')}</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        ${filtered.length ? `
        <table>
          <thead><tr>
            <th>${t('invoiceNo')}</th>
            <th>${t('customer')}</th>
            <th>${t('date')}</th>
            <th>${t('total')}</th>
            <th>${t('paid')}</th>
            <th>${t('balance')}</th>
            <th>${t('status')}</th>
            <th>${t('orderStatus')}</th>
            <th></th>
          </tr></thead>
          <tbody>
          ${filtered.map(o => `
            <tr>
              <td><strong>${esc(o.invoiceNo)}</strong></td>
              <td>
                <div style="font-weight:700">${esc(o.customerName)}</div>
                <div style="font-size:11.5px;color:var(--gray-500)">${esc(o.customerPhone || '—')}</div>
              </td>
              <td>${fmtDate(o.date)}</td>
              <td><strong>${fmtBHD(orderTotal(o))}</strong></td>
              <td style="color:var(--green-700);font-weight:600">${fmtBHD(orderPaid(o))}</td>
              <td style="color:${orderBalance(o) > 0 ? 'var(--red-600)' : 'var(--gray-400)'};font-weight:700">${fmtBHD(orderBalance(o))}</td>
              <td>${paymentBadge(o)}</td>
              <td>
                <select class="status-select ${STATUS_CLASS[o.status] || ''}" onchange="updateOrderStatus('${o.id}', this.value)">
                  ${STATUSES.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}
                </select>
              </td>
              <td>
                <div class="actions">
                  <button class="btn-icon wa" title="${t('whatsapp')}" onclick="sendWhatsApp('${o.id}')">💬</button>
                  <button class="btn-icon print" title="${t('invoicePreview')}" onclick="showInvoice('${o.id}')">👁️</button>
                  <button class="btn-icon" title="${t('edit')}" onclick="editOrder('${o.id}')">✏️</button>
                  <button class="btn-icon danger" title="${t('delete')}" onclick="deleteOrder('${o.id}')">🗑️</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty"><span class="big">🧾</span>${t('noOrdersFound')}</div>`}
      </div>
    </div>
  `;

  const searchInp = document.getElementById('ordSearch');
  searchInp.addEventListener('input', () => { orderSearchQ = searchInp.value; renderOrders(); });
  document.getElementById('ordStatus').addEventListener('change', e => { orderFilterStatus = e.target.value; renderOrders(); });
  document.getElementById('ordPay').addEventListener('change', e => { orderFilterPayment = e.target.value; renderOrders(); });
}

function updateOrderStatus(id, status){
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  o.status = status;
  save();
  toast(t('statusUpdated'), 'success');
  renderOrders();
}

function editOrder(id){
  editingOrderId = id;
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  cart = o.items.map(it => ({ uid: it.uid || uid(), ...it }));
  currentCustomerId = o.customerId;
  showView('pos');
}

function deleteOrder(id){
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  if (!confirm(t('confirmDeleteOrder'))) return;
  state.orders = state.orders.filter(x => x.id !== id);
  save();

/* =====================================================================
   REPORTS
   ===================================================================== */
let reportFrom = '';
let reportTo = '';

function renderReports(){
  const el = document.getElementById('view-reports');
  const now = new Date();
  const defTo = todayISO();
  const defFrom = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
  const from = reportFrom || defFrom;
  const to = reportTo || defTo;

  const orders = state.orders.filter(o => o.status !== 'Cancelled' && o.date >= from && o.date <= to);
  const totalSales = orders.reduce((a,o) => a + orderTotal(o), 0);
  const collected = orders.reduce((a,o) => a + orderPaid(o), 0);
  const outstanding = orders.reduce((a,o) => a + orderBalance(o), 0);
  const count = orders.length;

  // daily chart
  const dailyMap = {};
  const start = new Date(from + 'T12:00:00');
  const end = new Date(to + 'T12:00:00');
  const days = Math.min(60, Math.max(1, Math.round((end - start) / 86400000) + 1));
  for (let i = 0; i < days; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    dailyMap[d.toISOString().slice(0,10)] = 0;
  }
  orders.forEach(o => { if (dailyMap[o.date] !== undefined) dailyMap[o.date] += orderTotal(o); });
  const maxDaily = Math.max(1, ...Object.values(dailyMap));

  // payment breakdown
  const payMap = { Cash:0, BenefitPay:0, Other:0 };
  orders.forEach(o => { payMap[o.paymentMethod] = (payMap[o.paymentMethod] || 0) + orderPaid(o); });

  // top items
  const itemMap = {};
  orders.forEach(o => o.items.forEach(it => {
    itemMap[it.name] = (itemMap[it.name] || 0) + (Number(it.qty) || 0);
  }));
  const topItems = Object.entries(itemMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const maxItem = topItems.length ? topItems[0][1] : 1;

  el.innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2><span class="ico">📈</span> ${t('reports')}</h2>
      </div>
      <div class="card-body">
        <div class="range-bar">
          <button class="btn btn-ghost btn-sm" onclick="quickRange('today')">${t('today')}</button>
          <button class="btn btn-ghost btn-sm" onclick="quickRange('week')">${t('week')}</button>
          <button class="btn btn-ghost btn-sm" onclick="quickRange('month')">${t('month')}</button>
          <div style="width:1px;height:22px;background:var(--gray-200);margin:0 4px"></div>
          <input type="date" id="repFrom" value="${from}" style="padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:13px">
          <span style="color:var(--gray-400);font-weight:700">→</span>
          <input type="date" id="repTo" value="${to}" style="padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:13px">
          <button class="btn btn-primary btn-sm" onclick="applyReportRange()">${t('apply')}</button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat blue"><div class="stat-ico">💰</div>
        <div><div class="stat-lbl">${t('totalSales')}</div><div class="stat-val">${fmtBHD(totalSales)}</div></div></div>
      <div class="stat green"><div class="stat-ico">✅</div>
        <div><div class="stat-lbl">${t('collected')}</div><div class="stat-val">${fmtBHD(collected)}</div></div></div>
      <div class="stat red"><div class="stat-ico">⏳</div>
        <div><div class="stat-lbl">${t('outstanding')}</div><div class="stat-val">${fmtBHD(outstanding)}</div></div></div>
      <div class="stat purple"><div class="stat-ico">🧾</div>
        <div><div class="stat-lbl">${t('orderCount')}</div><div class="stat-val">${count}</div></div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2><span class="ico">📊</span> ${t('salesTrend')}</h2></div>
      <div class="card-body">
        <div class="chart-bars">
          ${Object.entries(dailyMap).map(([d, v]) => {
            const h = Math.round(v / maxDaily * 100);
            const dd = d.slice(8,10);
            return `<div class="chart-col">
              <div class="amt">${v > 0 ? v.toFixed(0) : ''}</div>
              <div class="bar" style="height:${Math.max(2, h)}%" title="${fmtDate(d)}: ${fmtBHD(v)}"></div>
              <div class="lbl">${dd}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
      <div class="card">
        <div class="card-head"><h2><span class="ico">💳</span> ${t('paymentBreakdown')}</h2></div>
        <div class="card-body">
          ${PAYMENT_METHODS.map(m => {
            const v = payMap[m] || 0;
            const pct = collected > 0 ? Math.round(v / collected * 100) : 0;
            return `<div class="pop-row" style="margin-bottom:12px">
              <div class="pop-name">${methodLabel(m)}</div>
              <div class="pop-bar-wrap" style="flex:1"><div class="pop-bar" style="width:${pct}%"></div></div>
              <div class="pop-val">${fmtBHD(v)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2><span class="ico">🏆</span> ${t('popularItems')}</h2></div>
        <div class="card-body">
          ${topItems.length ? `<div class="pop-list">
            ${topItems.map((x, i) => `
              <div class="pop-row">
                <div class="pop-rank">${i+1}</div>
                <div class="pop-name">${esc(x[0])}</div>
                <div class="pop-bar-wrap" style="flex:1"><div class="pop-bar" style="width:${Math.round(x[1]/maxItem*100)}%"></div></div>
                <div class="pop-val">${x[1]} pcs</div>
              </div>`).join('')}
          </div>` : `<div class="empty" style="padding:20px">${t('noData')}</div>`}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2><span class="ico">🧾</span> ${t('orders')}</h2></div>
      <div class="table-wrap">
        ${orders.length ? `
        <table>
          <thead><tr><th>${t('invoiceNo')}</th><th>${t('date')}</th><th>${t('customer')}</th>
            <th>${t('total')}</th><th>${t('paid')}</th><th>${t('balance')}</th><th>${t('paymentMethod')}</th></tr></thead>
          <tbody>
          ${orders.sort((a,b) => b.date.localeCompare(a.date)).map(o => `
            <tr>
              <td><strong>${esc(o.invoiceNo)}</strong></td>
              <td>${fmtDate(o.date)}</td>
              <td>${esc(o.customerName)}</td>
              <td>${fmtBHD(orderTotal(o))}</td>
              <td>${fmtBHD(orderPaid(o))}</td>
              <td style="color:${orderBalance(o) > 0 ? 'var(--red-600)' : 'var(--gray-400)'};font-weight:700">${fmtBHD(orderBalance(o))}</td>
              <td>${methodLabel(o.paymentMethod)}</td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty"><span class="big">📭</span>${t('noData')}</div>`}
      </div>
    </div>
  `;
}

function quickRange(kind){
  const now = new Date();
  if (kind === 'today') {
    reportFrom = todayISO(); reportTo = todayISO();
  } else if (kind === 'week') {
    const s = new Date(now); s.setDate(now.getDate() - now.getDay());
    reportFrom = s.toISOString().slice(0,10); reportTo = todayISO();
  } else if (kind === 'month') {
    reportFrom = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
    reportTo = todayISO();
  }
  renderReports();
}

function applyReportRange(){
  reportFrom = document.getElementById('repFrom').value;
  reportTo = document.getElementById('repTo').value;
  renderReports();
}

        <p style="color:var(--gray-500);font-size:13px;margin-bottom:14px;line-height:1.6">
          Your data is stored locally in this browser. Export regular backups and import them on another device.
        </p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="exportData()">⬇️ ${t('export')}</button>
          <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆️ ${t('importBackup')}</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
          <button class="btn btn-danger" onclick="wipeData()">🗑️ ${t('wipe')}</button>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
      <button class="btn btn-primary" onclick="saveSettings()">💾 ${t('saveSettings')}</button>
    </div>
  `;

  document.getElementById('stLogoFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 1024 * 1024) { toast('Max 1MB', 'error'); return; }
    const r = new FileReader();
    r.onload = () => {
      state.settings.logoData = r.result;
      save();
      renderSettings();
      document.getElementById('sideLogo').innerHTML = logoHTML(40);
      document.getElementById('loginLogo').innerHTML = logoHTML(64);
      toast('Logo updated', 'success');
    };
    r.readAsDataURL(f);
  });

  document.getElementById('stLang').addEventListener('change', e => {
    uiLang = e.target.value;
    applyLanguage();
  });
}

function removeLogo(){
  state.settings.logoData = '';
  save();
  renderSettings();
  document.getElementById('sideLogo').innerHTML = logoHTML(40);
  document.getElementById('loginLogo').innerHTML = logoHTML(64);

function saveSettings(){
  state.settings.shopName = document.getElementById('stShopName').value.trim() || 'Fresh and Clean Laundry';
  state.settings.phone = document.getElementById('stPhone').value.trim();
  state.settings.address = document.getElementById('stAddress').value.trim();
  state.settings.currency = document.getElementById('stCurrency').value.trim() || 'BHD';
  state.settings.countryCode = document.getElementById('stCountry').value.replace(/\D/g,'') || '973';
  state.settings.invoicePrefix = document.getElementById('stInvoicePrefix').value.trim() || 'FCL-';
  state.settings.nextInvoiceNo = Math.max(1, parseInt(document.getElementById('stNextInvoice').value) || 1);
  state.settings.vatEnabled = document.getElementById('stVatEnabled').value === 'true';
  state.settings.vatRate = Math.max(0, parseFloat(document.getElementById('stVatRate').value) || 0);
  state.settings.whatsappTemplate = document.getElementById('stWaTemplate').value;
  state.settings.whatsappFooter = document.getElementById('stWaFooter').value;
  const pin = document.getElementById('stAdminPin').value.trim();
  if (pin.length >= 4) state.settings.adminPin = pin;
  else { toast('PIN must be at least 4 digits', 'error'); return; }
  save();

  document.getElementById('loginShopName').textContent = state.settings.shopName;

}

/* =====================================================================
   WHATSAPP
   ===================================================================== */
function waNumber(phone){
  let p = String(phone || '').replace(/\D/g, '');
  const cc = (state.settings.countryCode || '973').replace(/\D/g, '');
  if (p.startsWith('00')) p = p.slice(2);
  if (!p.startsWith(cc)) p = cc + p.replace(/^0+/, '');
  return p;
}

function openWhatsApp(phone, text){
  if (!phone) { toast(t('noPhone'), 'error'); return; }
  const url = `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function buildWhatsAppMessage(order){
  const c = customerById(order.customerId);
  const custName = c ? c.name : (order.customerName || '—');
  const s = state.settings;

  const itemLines = order.items.map(it => {
    const lt = round3((Number(it.qty)||0) * ((Number(it.basePrice)||0) + (Number(it.specialCharge)||0)));
    return `${it.name} (${it.service}) × ${it.qty} — ${fmtBHD(lt)}`;
  }).join('\n');

  const extraLine = (Number(order.extraCharges) || 0) > 0
    ? `\nExtra Charges: ${fmtBHD(order.extraCharges)}` : '';
  const vatLine = (Number(order.vatAmount) || 0) > 0
    ? `\nVAT: ${fmtBHD(order.vatAmount)}` : '';

  const tpl = s.whatsappTemplate || DEFAULT_SETTINGS.whatsappTemplate;
  const map = {
    '{shopName}': s.shopName,
    '{invoiceNo}': order.invoiceNo,
    '{customerName}': custName,
    '{date}': fmtDate(order.date),
    '{deliveryDate}': fmtDate(order.deliveryDate),
    '{items}': itemLines,
    '{subtotal}': fmtBHD(orderSubtotal(order)),
    '{discount}': fmtBHD(order.discount || 0),
    '{extraLine}': extraLine,
    '{vatLine}': vatLine,
    '{total}': fmtBHD(orderTotal(order)),
    '{paid}': fmtBHD(orderPaid(order)),
    '{balance}': fmtBHD(orderBalance(order)),
    '{footer}': s.whatsappFooter || ''
  };
  let msg = tpl;
  Object.keys(map).forEach(k => { msg = msg.split(k).join(map[k]); });
  return msg;
}

function sendWhatsApp(orderId){
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const phone = o.customerPhone || (customerById(o.customerId) || {}).phone || '';
  if (!phone) { toast(t('noPhone'), 'error'); return; }
  const msg = buildWhatsAppMessage(o);
  openWhatsApp(phone, msg);
  toast('Opening WhatsApp…', 'info');
}

function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast(t('copied'), 'success'), () => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast(t('copied'), 'success');
  } catch(e) { toast(t('copyFailed'), 'error'); }
}

function statusLabelFor(s){
  const map = { 'Received':'received','Washing':'washing','Ironing':'ironing',
    'Ready for Pickup':'readyPickup','Delivered':'delivered','Cancelled':'cancelled' };
  return t(map[s] || s);
}

function showInvoice(orderId, autoPrint){
  const o = state.orders.find(x => x.id === orderId);
  if (!o) return;
  const html = invoiceHTML(o);
  const waMsg = buildWhatsAppMessage(o);
  const safe = JSON.stringify(waMsg).replace(/"/g,'&quot;');

  // fill print area
  document.getElementById('printArea').innerHTML = html;

  openModal(`
    <div class="modal-head">
      <h3>${t('invoicePreview')} — ${esc(o.invoiceNo)}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0;background:var(--gray-100)">
      ${html}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="copyText(${safe})">📋 ${t('preview')}</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨️ ${t('print')}</button>
      <button class="btn btn-ghost" onclick="window.print()">⬇️ ${t('downloadPdf')}</button>
      <button class="btn btn-green" onclick="closeModal();sendWhatsApp('${o.id}')">💬 ${t('sendWhatsApp')}</button>
    </div>
  `, { wide: true });

  if (autoPrint) setTimeout(() => window.print(), 300);
}

/* =====================================================================
   BACKUP
   ===================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fcl-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t('backupDownloaded'), 'success');
}

function importData(input){
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.settings || !Array.isArray(d.items)) throw new Error('bad');
      if (!confirm('Importing will REPLACE all current data. Continue?')) return;
      state = d;
      if (!Array.isArray(state.customers)) state.customers = [];
      if (!Array.isArray(state.orders)) state.orders = [];
      state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings);
      save();
      bootAfterAuth();
      toast(t('backupRestored'), 'success');
    } catch(err) {
      toast(t('invalidBackup'), 'error');
    }
  };
  r.readAsText(f);
  input.value = '';
}

function wipeData(){
  if (!confirm(t('confirmWipe'))) return;
  if (!confirm(t('confirmWipe2'))) return;
  localStorage.removeItem(STORAGE_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

/* =====================================================================
   BOOT
   ===================================================================== */
function bootAfterAuth(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('sideLogo').innerHTML = logoHTML(40);
  document.getElementById('sideShopName').textContent = state.settings.shopName;
  document.getElementById('loginShopName').textContent = state.settings.shopName;
  applyLanguage();
  showView('dashboard');
}

function bootLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginLogo').innerHTML = logoHTML(64);
  document.getElementById('loginShopName').textContent = state.settings.shopName;
  document.getElementById('loginSub').textContent = t('adminAccess');
  document.getElementById('loginBtn').textContent = t('login');
  document.getElementById('pinInput').placeholder = t('enterPin');
  document.getElementById('loginHint').innerHTML = t('defaultPin') + ': <b>1234</b>';
  document.getElementById('loginError').textContent = '';

  const pinInput = document.getElementById('pinInput');
  const loginBtn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('loginError');

  function tryLogin(){
    if (doLogin(pinInput.value)) {
      bootAfterAuth();
    } else {
      errorEl.textContent = t('wrongPin');
      pinInput.value = '';
      pinInput.focus();
      setTimeout(() => { errorEl.textContent = ''; }, 2400);
    }
  }
  loginBtn.onclick = tryLogin;
  pinInput.onkeydown = e => { if (e.key === 'Enter') tryLogin(); };
  pinInput.focus();
}

document.addEventListener('DOMContentLoaded', () => {
  // wire top bar
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  });
  document.getElementById('overlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  });
  document.getElementById('langBtn').addEventListener('click', () => {
    uiLang = uiLang === 'en' ? 'ar' : 'en';
    applyLanguage();
  });
  document.getElementById('quickNewBill').addEventListener('click', () => {
    editingOrderId = null; cart = []; currentCustomerId = '';
    showView('pos');
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (confirm(t('signedOut') + '?')) doLogout();
  });
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  if (isAuthed()) bootAfterAuth();

  // expose functions for inline handlers
  window.showView = showView;

  window.saveItem = saveItem;
  window.deleteItem = deleteItem;
  window.editCustomerModal = editCustomerModal;
  window.saveCustomer = saveCustomer;
  window.deleteCustomer = deleteCustomer;
  window.editOrder = editOrder;
  window.deleteOrder = deleteOrder;
  window.updateOrderStatus = updateOrderStatus;
  window.togglePaid = togglePaid;
  window.showInvoice = showInvoice;
  window.sendWhatsApp = sendWhatsApp;
  window.openWhatsApp = openWhatsApp;
  window.copyText = copyText;
  window.saveSettings = saveSettings;
  window.removeLogo = removeLogo;
  window.exportData = exportData;
  window.importData = importData;
  window.wipeData = wipeData;
  window.quickRange = quickRange;
  window.applyReportRange = applyReportRange;
  window.closeModal = closeModal;
});
</script>
